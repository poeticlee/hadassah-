# Netlify deployment configuration for Hadassah Creations Concept.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback so deep links such as /products/customised-hotel-soaps resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
